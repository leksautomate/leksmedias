# Self-hosted stack: Postgres, migrations, web app, worker and an HTTPS reverse proxy.
# Copy .env.example to .env, fill it in, then:  docker compose up -d --build
#
# Postgres is NOT published to the internet. Only Caddy (80/443) is. Reach the database with:
#   docker compose exec db psql -U "$POSTGRES_USER" "$POSTGRES_DB"

x-app: &app
  build:
    context: .
    args:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-leks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-leks}
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leks}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leks} -d ${POSTGRES_DB:-leks}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Uncomment to reach the database from this machine only (never 0.0.0.0):
    # ports:
    #   - "127.0.0.1:5432:5432"

  migrate:
    <<: *app
    restart: "no"
    command: ["npx", "tsx", "db/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: ["npx", "next", "start", "-p", "3000"]
    expose: ["3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["npx", "tsx", "worker/index.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
